# ============================================================
# InternVision Portal — Backend Application Properties
# All sensitive values are read from environment variables.
# NEVER hardcode secrets in this file.
# ============================================================

# ── Application ─────────────────────────────────────────────
spring.application.name=internvision-portal
server.port=${PORT:8080}

# ── Jackson JSON ────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── JWT ─────────────────────────────────────────────────────
# Minimum 256-bit secret key
jwt.secret=${JWT_SECRET:ThisIsMyVeryLongSecretKeyForJWTAuthentication123456789}
# Token expiry in milliseconds (default: 24 hours)
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Razorpay ────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:test_key}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret}

# ── Firebase ────────────────────────────────────────────────
firebase.project.id=${FIREBASE_PROJECT_ID:internvision-portal}
# Path to service account JSON (classpath or file system)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
# Optional: inline JSON for cloud deployments (Base64-encoded)
firebase.service.account.json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# ── CORS ────────────────────────────────────────────────────
# Comma-separated allowed origins
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Logging ─────────────────────────────────────────────────
logging.level.com.internvision.portal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
